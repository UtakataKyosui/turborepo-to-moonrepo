name: ✨ Feature Request
description: Suggest an idea for LocoMotive
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature! 🚀

  - type: textarea
    id: problem
    attributes:
      label: 🤔 Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: 📂 Feature Category
      description: What category does this feature belong to?
      options:
        - OpenAPI parsing and analysis
        - ER diagram integration
        - CLI interface and usability
        - Output formats and generation
        - Performance and optimization
        - Documentation and examples
        - Testing and quality assurance
        - Cross-platform compatibility
        - Other (please specify in additional context)
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: 📊 Expected Impact
      description: What impact do you expect this feature to have?
      options:
        - label: Improves user experience
        - label: Adds new functionality
        - label: Enhances performance
        - label: Improves code quality
        - label: Reduces complexity
        - label: Better error handling
        - label: Enhanced documentation

  - type: textarea
    id: examples
    attributes:
      label: 📝 Usage Examples
      description: If applicable, provide examples of how this feature would be used.
      placeholder: |
        Example usage:
        ```bash
        lcm generate --input api.json --new-feature-flag
        ```

  - type: textarea
    id: context
    attributes:
      label: 📋 Additional Context
      description: Add any other context, mockups, or examples about the feature request here.
      placeholder: Any additional information that might be helpful...