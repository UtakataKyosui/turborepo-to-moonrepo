name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from tag
      id: extract_version
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Extract changelog for current version
        if [ -f "CHANGELOG.md" ]; then
          # Try to extract changelog section for current version
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          
          # Create a temporary changelog
          echo "## What's New in v${VERSION}" > temp_changelog.md
          echo "" >> temp_changelog.md
          
          # Extract the relevant section from CHANGELOG.md
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md >> temp_changelog.md || true
          
          # If extraction failed, add generic message
          if [ ! -s temp_changelog.md ] || [ $(wc -l < temp_changelog.md) -lt 3 ]; then
            echo "## What's New in v${VERSION}" > temp_changelog.md
            echo "" >> temp_changelog.md
            echo "🚀 **LocoMotive v${VERSION} Release**" >> temp_changelog.md
            echo "" >> temp_changelog.md
            echo "- Enhanced OpenAPI to Loco scaffold generation" >> temp_changelog.md
            echo "- Comprehensive ER diagram integration with Mermaid support" >> temp_changelog.md
            echo "- Multi-format support (.md, .mermaid, .mmd files)" >> temp_changelog.md
            echo "- Improved relationship detection and modeling" >> temp_changelog.md
            echo "- Complete CLI with lcm command alias" >> temp_changelog.md
            echo "" >> temp_changelog.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for detailed information." >> temp_changelog.md
          fi
          
          cat temp_changelog.md
        else
          echo "📋 Release v${VERSION} - LocoMotive OpenAPI to Loco Scaffold Generator"
        fi

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.extract_version.outputs.TAG }}
        release_name: LocoMotive v${{ steps.extract_version.outputs.VERSION }}
        body_path: temp_changelog.md
        draft: false
        prerelease: false

  build_and_upload:
    name: Build and Upload Assets
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: lcm-linux-amd64
            
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: lcm-linux-musl-amd64
            
          # macOS builds
          - os: macos-latest
            target: x86_64-apple-darwin
            name: lcm-macos-intel
            
          - os: macos-latest
            target: aarch64-apple-darwin
            name: lcm-macos-apple-silicon
            
          # Windows builds
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: lcm-windows-amd64.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install cross compilation tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build release binary
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Prepare binary for upload
      shell: bash
      run: |
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          cp target/${{ matrix.target }}/release/lcm.exe ${{ matrix.name }}
        else
          cp target/${{ matrix.target }}/release/lcm ${{ matrix.name }}
          chmod +x ${{ matrix.name }}
        fi

    - name: Create tarball (non-Windows)
      if: runner.os != 'Windows'
      run: |
        tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
        echo "ASSET_PATH=${{ matrix.name }}.tar.gz" >> $GITHUB_ENV
        echo "ASSET_NAME=${{ matrix.name }}.tar.gz" >> $GITHUB_ENV

    - name: Create zip archive (Windows)
      if: runner.os == 'Windows'
      run: |
        7z a ${{ matrix.name }}.zip ${{ matrix.name }}
        echo "ASSET_PATH=${{ matrix.name }}.zip" >> $env:GITHUB_ENV
        echo "ASSET_NAME=${{ matrix.name }}.zip" >> $env:GITHUB_ENV

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create_release.outputs.upload_url }}
        asset_path: ${{ env.ASSET_PATH }}
        asset_name: ${{ env.ASSET_NAME }}
        asset_content_type: application/octet-stream

  publish_crate:
    name: Publish to crates.io
    needs: [create_release, build_and_upload]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Login to crates.io
      run: cargo login ${{ secrets.CRATES_IO_TOKEN }}

    - name: Publish to crates.io
      run: cargo publish

  update_release_notes:
    name: Update Release with Build Info
    needs: [create_release, build_and_upload]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version
      id: extract_version
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update release description
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read the original changelog
          let body = '';
          if (fs.existsSync('temp_changelog.md')) {
            body = fs.readFileSync('temp_changelog.md', 'utf8');
          } else {
            body = `## LocoMotive v${{ steps.extract_version.outputs.VERSION }}\n\nOpenAPI to Loco scaffold generator with ER diagram integration.`;
          }
          
          // Add download section
          body += `\n\n## 📥 Downloads\n\n`;
          body += `### Quick Install\n\n`;
          body += `\`\`\`bash\n`;
          body += `# Using cargo (recommended)\n`;
          body += `cargo install locomotive\n\n`;
          body += `# Or download pre-built binaries below\n`;
          body += `\`\`\`\n\n`;
          body += `### Pre-built Binaries\n\n`;
          body += `| Platform | Architecture | Download |\n`;
          body += `|----------|-------------|----------|\n`;
          body += `| Linux | x86_64 | [lcm-linux-amd64.tar.gz] |\n`;
          body += `| Linux | x86_64 (musl) | [lcm-linux-musl-amd64.tar.gz] |\n`;
          body += `| macOS | Intel | [lcm-macos-intel.tar.gz] |\n`;
          body += `| macOS | Apple Silicon | [lcm-macos-apple-silicon.tar.gz] |\n`;
          body += `| Windows | x86_64 | [lcm-windows-amd64.exe.zip] |\n\n`;
          body += `### Usage\n\n`;
          body += `\`\`\`bash\n`;
          body += `# Basic usage\n`;
          body += `lcm generate --input api.json\n\n`;
          body += `# With ER diagram integration\n`;
          body += `lcm generate --input api.json --er-diagram schema.md\n\n`;
          body += `# Analyze API structure\n`;
          body += `lcm analyze --input api.json --verbose\n`;
          body += `\`\`\`\n\n`;
          body += `🚀 **Features**: OpenAPI 3.0 parsing, ER diagram integration, Mermaid support, Multi-format output, Reference detection\n\n`;
          body += `📖 **Documentation**: See [README.md](README.md) for detailed usage instructions.`;
          
          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: ${{ needs.create_release.outputs.release_id }},
            body: body
          });