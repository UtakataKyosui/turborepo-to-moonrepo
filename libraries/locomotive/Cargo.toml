[package]
name = "locomotive"
version = "0.5.0"
edition = "2024"

[[bin]]
name = "lcm"
path = "src/main.rs"

[dependencies]
openapiv3 = "2.2.0"
serde_json = "1.0.143"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
handlebars = "4.0"
regex = "1.0"
convert_case = "0.6"
pulldown-cmark = "0.9"  # Markdown parser for .md files
nom = "7.1"             # Parser combinator for Mermaid syntax

[dev-dependencies]
tempfile = "3.0"
