id: 'ui'
language: 'typescript'
layer: 'library'
stack: 'frontend'

dependsOn:
  - 'biome-config'
  - 'typescript-config'

fileGroups:
  source:
    - glob: 'src/**'
      cache: true
  configs:
    - glob: '*.json'
    - glob: '*.config.*'

tasks:
  check:
    command: 'biome check .'
    inputs:
      - '@globs(source)'
      - 'biome.json'
    outputs: []

  fix:
    command: 'biome check --fix .'
    inputs:
      - '@globs(source)'
      - 'biome.json'
    outputs: []
