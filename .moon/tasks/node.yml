tasks:
  build:
    command: pnpm run build
    deps:
    - ^:build
    inputs:
    - glob: '.env*'
      cache: true
    outputs:
    - '.next/**/*'
    - '!.next/cache/**/*'
  dev:
    command: pnpm run dev
    options:
      cache: false
    preset: server
  lint:
    command: pnpm run lint
    deps:
    - ^:lint
  format:
    command: pnpm run format
    deps:
    - ^:format
